<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dice Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🎲 <span>DICE</span> ARENA</div>
    <div class="creator">Created by <b>Anshu</b></div>
  </header>

  <section class="panel period">
    <div><small>PERIOD</small><b id="period">000001</b></div>
    <button class="how" type="button">☷ How to play</button>
    <div class="manual"><small>MODE</small><b>MANUAL</b></div>
  </section>

  <section class="dice-panel">
    <div class="green-stage">
      <div class="dice-row">
        <div class="die" data-v="1"></div>
        <div class="die" data-v="1"></div>
        <div class="die" data-v="1"></div>
      </div>
    </div>
    <div class="total">TOTAL <b id="total">—</b></div>
    <div class="actions"><button id="roll" class="primary" type="button">ROLL DICE</button><button id="reset" class="reset" type="button">RESET</button></div>
  </section>

  <section class="panel choices">
    <div class="panel-head"><b>NUMBER</b><span>Select one or more</span></div>
    <div id="numbers" class="numbers"></div>

    <div class="panel-head"><b>BIG / SMALL</b></div>
    <div class="four">
      <button class="pick small" type="button" data-kind="size" data-val="small">SMALL<em>3–10</em></button>
      <button class="pick big" type="button" data-kind="size" data-val="big">BIG<em>11–18</em></button>
      <button class="pick even" type="button" data-kind="parity" data-val="even">EVEN<em>2,4,6…</em></button>
      <button class="pick odd" type="button" data-kind="parity" data-val="odd">ODD<em>1,3,5…</em></button>
    </div>

    <div class="wallet">
      <div>❤️<span>Lives</span><b id="lives">10</b></div>
      <div>🪙<span>Credits</span><b id="credits">0</b></div>
      <div>🔥<span>Streak</span><b id="streak">0</b></div>
    </div>
    <div id="notice" class="notice" aria-live="polite">Choose your options and roll.</div>
  </section>

  <section class="panel result-panel">
    <div class="panel-head"><b>ROUND RESULT</b><span>Every selected choice is checked separately</span></div>
    <div id="resultList" class="result-list"><div class="empty">No result yet.</div></div>
  </section>

  <section class="panel history">
    <div class="panel-head"><b>GAME HISTORY</b><span>Latest rounds</span></div>
    <div class="history-head"><span>ROUND</span><span>DICE / TOTAL</span><span>RESULT</span></div>
    <div id="history"></div>
  </section>
</div>

<div id="resultAnimation" class="result-animation" aria-hidden="true">
  <div id="medal" class="medal">✓</div>
  <div id="animationTitle">WIN</div>
  <div id="animationSub">Choice matched</div>
</div>

<script src="script.js"></script>
</body>
</html>
